[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibrating-water"
version = "0.1.0"
description = "GPU/CPU-hybrid SPH simulation of water vibrating inside a spherical glass container, with Panda3D rendering and HDF5/SQLite data logging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TeacherEvan" },
]
keywords = ["sph", "fluid-simulation", "taichi", "panda3d", "physics", "vfx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "taichi>=1.7.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "panda3d>=1.10.14",
    "dearpygui>=1.10.0",
    "h5py>=3.10.0",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]
cpu = [
    "taichi>=1.7.0",
]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/TeacherEvan/Simulation--Vibrating-water-effects"

[tool.setuptools]
py-modules = ["visual_effects_manager"]

[tool.setuptools.package-data]
"shaders" = ["**/*.glsl", "**/*.vert", "**/*.frag", "**/*.geom", "**/*.compute"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false

[tool.flake8]
max-line-length = 127
max-complexity = 10
exclude = [".venv", "build", "dist", ".git", "__pycache__"]
